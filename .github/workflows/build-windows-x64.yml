name: Build Windows x64 Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish installer to GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag to publish (required when publish_release=true on branch runs)"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Setup Rust toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Windows bundlers (NSIS + WiX)
        shell: powershell
        run: |
          choco install nsis wixtoolset -y

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 package
        run: pnpm run build:win:x64

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: todo-studio-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe

      - name: Publish installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
