name: Build Linux x64 Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish installer to GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag to publish (required when publish_release=true on branch runs)"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Setup Rust toolchain (GNU x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux x64 package
        run: pnpm exec tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: todo-studio-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb

      - name: Publish installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('manual-{0}', github.run_number)) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
