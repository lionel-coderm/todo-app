name: Build macOS Universal Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish installer to GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag to publish (required when publish_release=true on branch runs)"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-macos-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-universal:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Setup Rust toolchain (macOS universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS universal package
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg --no-sign

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: todo-studio-macos-universal
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app

      - name: Publish installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
